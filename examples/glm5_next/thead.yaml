# GLM-5.3 / pinned PPU runtime profile, not a global platform default.
prefer: flagos
strict: true
op_backends:
  silu_and_mul_with_clamp: [flagos, reference]
  mhc_pre_with_norm: [flagos, reference]
  mhc_post: [flagos, reference]
  mhc_fused_post_pre_with_norm: [flagos, reference]
flagos_blacklist:
  - index
  - mm
  - bmm
  - mm_out
  - randn
  - randn_like
  - normal
  - normal_
  - normal.Tensor_Tensor
  - normal.Tensor_float
  - normal.float_Tensor
  - rand
  - rand_like
  - randint
  - randint_like
  - bernoulli
